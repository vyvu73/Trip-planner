[project]
name = "trip-planner"
version = "0.1.0"
description = "Shared environment for RAG project"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "braintrust>=0.48.0",
    "gradio>=6.28.0",
    "kitaru[cli,mcp,worker]>=0.27.2",
    "openai>=1.100.2",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.1.1",
    "requests>=2.32.0",
    "tiktoken>=0.12.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "firecrawl>=4.44.0",
    "gradio>=6.28.0",
    "praw>=8.0.3",
    "python-dotenv>=1.2.3",
]
