[project]
name = "trip-planner"
version = "0.1.0"
description = "Shared environment for RAG project"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "gradio>=6.28.0",
    "openai>=1.100.2",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.1.1",
    "requests>=2.32.0",
    "tiktoken>=0.12.0",
]

[tool.uv]
package = false

[tool.poetry]
name = "trip-planner"
version = "0.1.0"
description = "Shared environment for RAG project"
authors = ["Vy Vu"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
jupyter = ">=1.1.1,<2.0.0"
ipykernel = ">=6.30.1,<7.0.0"
openai = "^1.100.2"
python-dotenv = "^1.1.1"
tiktoken = "^0.12.0"
numpy = "^2.3.2"
psycopg2-binary = "^2.9.10"
gradio = "^5.43.1"
langchain-experimental = "^0.3.4"
langchain-openai = "^0.3.30"
nltk = "^3.10.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "firecrawl>=4.44.0",
    "gradio>=6.28.0",
    "praw>=8.0.3",
    "python-dotenv>=1.2.3",
]
