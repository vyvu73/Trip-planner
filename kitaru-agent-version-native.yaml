# Kitaru agent version for replays through the native adapter
# (kitaru_native_replay.py, src/kitaru_native/adapter.py). Register with:
#   kitaru agent version register trip-planner --spec kitaru-agent-version-native.yaml
# The adapter wraps the app's OpenAI clients and tool dispatcher in process,
# so replays can apply overrides (model, system prompt, prompt, reasoning /
# temperature / max_output_tokens) and passthrough, static, or history tool
# policies. The llm tool policy is rejected.
display_version: native-adapter-tool-implementation
description: Native in-process adapter replay entrypoint (kitaru_native_replay.py); overrides and tool policies
capabilities:
  tools: [get_weather, get_route, get_transportation_cost]
run_spec:
  command: .venv/bin/python kitaru_native_replay.py
  working_dir: /home/vv03007/projects/Trip-planner
  # Kitaru records these runs directly: no Braintrust traces, no ingestion wait.
  env:
    BRAINTRUST_API_KEY: ""
  timeout_seconds: 300
  runtime_capabilities:
    overrides: true
    tool_policies: true
