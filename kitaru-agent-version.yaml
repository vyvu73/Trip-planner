# Kitaru agent version for replays through the Braintrust importer-backed
# adapter (kitaru_replay.py). Register with:
#   kitaru agent version register trip-planner --spec kitaru-agent-version.yaml
# The adapter imports the Braintrust trace after a run, so it cannot apply
# replay overrides or recorded/static tool results: replays rerun the current
# code with live tools.
display_version: importer-adapter-tool-implementation
description: Braintrust importer-backed replay entrypoint (kitaru_replay.py); input rerun with live tools
capabilities:
  tools: [get_weather, get_route, get_transportation_cost]
run_spec:
  command: .venv/bin/python kitaru_replay.py
  working_dir: /home/vv03007/projects/Trip-planner
  # Includes waiting for Braintrust to finish ingesting the trace.
  timeout_seconds: 600
  runtime_capabilities:
    overrides: false
    tool_policies: false
